<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="_base.css" />
  <style>
    .screen { display: flex; flex-direction: column; background: #f4f6f8; }
    .header { height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 20px; gap: 16px; font-weight: 600; }
    .body { flex: 1; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 0; padding: 16px; }
    .menu { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 16px; }
    .menu h2 { font-size: 14px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .item { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; min-height: 72px; }
    .item strong { font-size: 13px; display: block; }
    .item span { font-size: 12px; color: #6b7280; }
    .cart { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 16px; display: flex; flex-direction: column; }
    .line { display: flex; justify-content: space-between; font-size: 13px; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
    .pay { margin-top: auto; background: #3a6dff; color: #fff; text-align: center; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div class="screen">
    <header class="header">
      <span style="color:#3a6dff">●</span> Bella Kitchen POS
      <span style="font-weight:400;color:#6b7280;font-size:13px">Counter 1 · Downtown</span>
    </header>
    <div class="body">
      <section class="menu">
        <h2>Mains</h2>
        <div class="grid">
          <div class="item"><strong>Margherita</strong><span>$12.50</span></div>
          <div class="item"><strong>Harbor Bowl</strong><span>$14.00</span></div>
          <div class="item"><strong>Chicken Sand.</strong><span>$13.25</span></div>
          <div class="item"><strong>Garden Salad</strong><span>$8.50</span></div>
          <div class="item"><strong>Soup of day</strong><span>$6.00</span></div>
          <div class="item"><strong>Fries</strong><span>$4.50</span></div>
        </div>
      </section>
      <section class="cart">
        <h2 style="font-size:14px;margin-bottom:8px">Cart · #4822</h2>
        <div class="line"><span>Harbor Bowl ×1</span><span>$14.00</span></div>
        <div class="line"><span>Sparkling water ×2</span><span>$6.00</span></div>
        <div class="line"><span>Subtotal</span><span>$20.00</span></div>
        <div class="line"><span>Tax</span><span>$1.60</span></div>
        <div class="line" style="font-weight:700;border:none"><span>Total</span><span>$21.60</span></div>
        <div class="pay">Pay $21.60</div>
      </section>
    </div>
  </div>
</body>
</html>
