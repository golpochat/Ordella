# Staging / production-like stack (API + infra)
# Usage: docker compose -f infrastructure/docker/docker-compose.deploy.yml --env-file infrastructure/env/.env.staging.example up -d

name: ordella-deploy

include:
  - path: ./docker-compose.yml

services:
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api/Dockerfile
    container_name: ordella-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-staging}
      API_PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN:-ordella.local}
      ONBOARDING_HOST: ${ONBOARDING_HOST:-app.ordella.local}
      ADMIN_HOST: ${ADMIN_HOST:-admin.ordella.local}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RUN_MIGRATIONS_ON_BOOT: ${RUN_MIGRATIONS_ON_BOOT:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ordella-assets}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ordella
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
