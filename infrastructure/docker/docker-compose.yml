  payments-service:
    <<: *microservice-base
    container_name: ordella-payments-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: payments-service
      SERVICE_NAME: payments-service
    ports:
      - "3013:80"
    labels:
      ordella.service: payments

  delivery-service:
    <<: *microservice-base
    container_name: ordella-delivery-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: delivery-service
      SERVICE_NAME: delivery-service
    ports:
      - "3014:80"
    labels:
      ordella.service: delivery

  customers-service:
    <<: *microservice-base
    container_name: ordella-customers-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: customers-service
      SERVICE_NAME: customers-service
    ports:
      - "3015:80"
    labels:
      ordella.service: customers

  notifications-service:
    <<: *microservice-base
    container_name: ordella-notifications-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: notifications-service
      SERVICE_NAME: notifications-service
    ports:
      - "3016:80"
    labels:
      ordella.service: notifications

  reports-service:
    <<: *microservice-base
    container_name: ordella-reports-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: reports-service
      SERVICE_NAME: reports-service
    ports:
      - "3017:80"
    labels:
      ordella.service: reports

  integrations-service:
    <<: *microservice-base
    container_name: ordella-integrations-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: integrations-service
      SERVICE_NAME: integrations-service
    ports:
      - "3018:80"
    labels:
      ordella.service: integrations

  # ---------------------------------------------------------------------------
  # Supporting domain services (modular monolith modules / future splits)
  # ---------------------------------------------------------------------------

  tenants-service:
    <<: *microservice-base
    container_name: ordella-tenants-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: tenants-service
      SERVICE_NAME: tenants-service
    ports:
      - "3019:80"
    labels:
      ordella.service: tenants

  locations-service:
    <<: *microservice-base
    container_name: ordella-locations-service
    environment:
