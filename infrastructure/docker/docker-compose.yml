  audit-service:
    <<: *microservice-base
    container_name: ordella-audit-service
    environment:
      <<: *microservice-env
      WHOAMI_NAME: audit-service
      SERVICE_NAME: audit-service
    ports:
      - "3022:80"
    labels:
      ordella.service: audit

  # ---------------------------------------------------------------------------
  # Frontend app placeholders (Next.js — replace with build targets later)
  # ---------------------------------------------------------------------------

  admin-app:
    <<: *microservice-base
    container_name: ordella-admin-app
    environment:
      <<: *microservice-env
      WHOAMI_NAME: admin-app
      SERVICE_NAME: admin-app
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:80"
    labels:
      ordella.service: admin

  pos-app:
    <<: *microservice-base
    container_name: ordella-pos-app
    environment:
      <<: *microservice-env
      WHOAMI_NAME: pos-app
      SERVICE_NAME: pos-app
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3002:80"
