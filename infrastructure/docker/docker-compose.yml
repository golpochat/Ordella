    ports:
      - "3004:80"
    labels:
      ordella.service: driver

networks:
  ordella:
    name: ordella-network
    driver: bridge

volumes:
  postgres_data:
    name: ordella-postgres-data
  redis_data:
    name: ordella-redis-data
  rabbitmq_data:
    name: ordella-rabbitmq-data
  minio_data:
    name: ordella-minio-data
