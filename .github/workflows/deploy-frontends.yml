name: Deploy Frontends

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/admin-ui/**'
      - 'apps/storefront/**'
      - 'apps/shared-ui/**'
      - 'apps/shared-utils/**'
      - '.github/workflows/deploy-frontends.yml'

jobs:
  vercel-preview:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [admin-ui, storefront]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npx turbo run build --filter=@ordella/${{ matrix.app }}

      - name: Deploy note
        run: |
          echo "Connect apps/${{ matrix.app }} to Vercel with root directory apps/${{ matrix.app }}"
          echo "Set NEXT_PUBLIC_API_URL per environment (staging/production)"
